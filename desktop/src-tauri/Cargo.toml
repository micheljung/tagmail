[package]
name = "tagmail-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "tagmail_desktop"

[[bin]]
name = "tagmail-desktop"
path = "src/main.rs"
required-features = ["app"]

[features]
# The Tauri shell needs WebKitGTK dev libs on Linux; the lib does not, so the
# main CI job builds and tests it without them.
app = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-single-instance",
    "dep:tracing-subscriber",
]
# Self-test page, fixture data and env overrides; never in release builds.
test-hooks = []

[dependencies]
form_urlencoded.workspace = true
http = "1"
keyring = { version = "4", default-features = false, features = ["v1"] }
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider", "json"] }
serde.workspace = true
serde_json.workspace = true
tagmail-api-core = { workspace = true, features = ["sqlite"] }
tagmail-core.workspace = true
tagmail-replica = { path = "../../crates/replica" }
tagmail-store.workspace = true
tauri = { version = "2.12", optional = true, features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = { version = "2.7", optional = true }
tauri-plugin-deep-link = { version = "2.6", optional = true }
tauri-plugin-notification = { version = "2.8", optional = true }
tauri-plugin-single-instance = { version = "2.5", optional = true, features = ["deep-link"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
url.workspace = true
zeroize.workspace = true

[[test]]
name = "notify"
required-features = ["app", "test-hooks"]

[[test]]
name = "mailto"
required-features = ["app", "test-hooks"]

[build-dependencies]
tauri-build = { version = "2.7", optional = true }

[dev-dependencies]
tempfile.workspace = true

# The in-process server links jemalloc, which does not build with MSVC.
[target.'cfg(unix)'.dev-dependencies]
reqwest = { workspace = true, features = ["rustls-no-provider", "json"] }
tagmail-api-server = { path = "../../crates/api-server" }
