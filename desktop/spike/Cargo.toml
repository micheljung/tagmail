[package]
name = "tagmail-desktop-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
publish = false

# Own workspace: Tauri needs WebKitGTK dev libs on Linux, which the main
# workspace CI job does not install.
[workspace]

[lib]
name = "spike"

[[bin]]
name = "tagmail-desktop-spike"
path = "src/main.rs"
required-features = ["app"]

[features]
app = ["dep:tauri", "dep:tauri-build"]

[dependencies]
http = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", optional = true, features = [] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2.7", optional = true, features = [] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
