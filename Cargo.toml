[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/micheljung/tagmail"
publish = false

[workspace.dependencies]
ammonia = "4"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tracing"] }
base64 = "0.23"
caseless = "0.2"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
ipnet = "2"
mail-parser = "1"
passkey = "0.6"
percent-encoding = "2"
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tagmail-api-core = { path = "crates/api-core" }
tagmail-core = { path = "crates/core" }
tagmail-engine = { path = "crates/engine" }
tagmail-imap = { path = "crates/imap" }
tagmail-store = { path = "crates/store" }
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
unicode-normalization = "0.1"
url = "2"
webauthn-rs = { version = "0.6", default-features = false }
webpki-roots = "1"
zeroize = "1"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Password hashing (argon2id, 19 MiB) is unusably slow unoptimized in tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
