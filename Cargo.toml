[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/micheljung/tagmail"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
caseless = "0.2"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
hex = "0.4"
mail-parser = "1"
proptest = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tagmail-api-core = { path = "crates/api-core" }
tagmail-core = { path = "crates/core" }
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = "1"
tracing = "0.1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
unicode-normalization = "0.1"
zeroize = "1"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
