[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-only"
repository = "https://github.com/micheljung/tagmail"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tracing"] }
base64 = "0.23"
caseless = "0.2"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
mail-parser = "1"
percent-encoding = "2"
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tagmail-api-core = { path = "crates/api-core" }
tagmail-core = { path = "crates/core" }
tagmail-store = { path = "crates/store" }
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
unicode-normalization = "0.1"
zeroize = "1"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
