[alias]
xtask = "run --package xtask --"

[env]
# Compiled into jemalloc (tikv-jemalloc-sys) because `malloc_conf` cannot be
# set from safe Rust: two arenas, background purging, dirty pages returned
# after one second (plan 3.13).
JEMALLOC_SYS_WITH_MALLOC_CONF = "narenas:2,background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:0"
