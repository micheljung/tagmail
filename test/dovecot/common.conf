base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout

protocols = imap

default_internal_user = vmail
default_login_user = vmail
default_internal_group = vmail

ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

userdb static {
  fields {
    home = /srv/vmail/%{user | username}
  }
}

mail_uid = vmail
mail_gid = vmail
mail_driver = maildir
mail_path = ~/Maildir

mail_attribute {
  dict file {
    path = %{home}/dovecot-attributes
  }
}

protocol imap {
  imap_metadata = yes
}

namespace inbox {
  inbox = yes
  separator = /

  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

imap_max_line_length = 64k

service imap-login {
  inet_listener imap {
    port = 31143
  }
}
