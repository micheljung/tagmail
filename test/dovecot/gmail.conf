dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3

!include /etc/dovecot/common.conf

mail_plugins {
  virtual = yes
}

namespace virtual {
  prefix = [Gmail]/
  separator = /
  mail_driver = virtual
  mail_path = /etc/dovecot/virtual
  mail_index_path = ~/virtual-index
  list = yes
  subscriptions = no

  mailbox All {
    special_use = \All
    auto = subscribe
  }
}
