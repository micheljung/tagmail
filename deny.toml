[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa via webauthn-rs only verifies RS256 assertions with public keys;
  # the Marvin timing attack needs private-key decryption or signing.
  { id = "RUSTSEC-2023-0071", reason = "webauthn-rs uses RSA for public-key signature verification only" },
  # imap-types and calcard both require chrono and offer no alternative yet.
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable; required by imap-types and calcard" },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  # Mozilla root certificates as data
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
  # The same roots as certificates; rustls-platform-verifier (reqwest) on
  # targets without a system store
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# OpenSSL-free musl static build, see docs/dev/spikes.md (spike 3)
deny = [
  { crate = "openssl", reason = "OpenSSL-free build: use rustls (ring) and web-push-native, not web-push" },
  { crate = "openssl-sys", reason = "OpenSSL-free build: use rustls (ring) and web-push-native, not web-push" },
  { crate = "native-tls", reason = "Links OpenSSL on Linux: disable default features (lettre, reqwest) and use rustls" },
  { crate = "aws-lc-sys", reason = "rustls crypto provider is ring: use reqwest rustls-no-provider, lettre ring" },
  # RUSTSEC-2023-0071 is ignored above only for webauthn-rs's verify-only use
  { crate = "rsa", wrappers = ["crypto-glue"], reason = "RSA only via webauthn-rs (crypto-glue), see RUSTSEC-2023-0071 above" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
