# Copy to compose.yml next to master.key and set the public origin your
# reverse proxy serves (README.md in this directory).
services:
  tagmail:
    image: ghcr.io/micheljung/tagmail:latest
    restart: unless-stopped
    command: ["--public-origin", "https://mail.example.com", "--trusted-proxy", "172.30.78.1"]
    ports:
      - "127.0.0.1:7878:7878"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - tagmail-data:/data
    secrets:
      - tagmail_master_key

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.78.0/24
          gateway: 172.30.78.1

volumes:
  tagmail-data:

secrets:
  tagmail_master_key:
    file: ./master.key
