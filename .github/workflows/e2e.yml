name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SEED: 1
  SEED_COUNT: 100000
  SEED_AVG_KB: 8
  SEED_DIR: ${{ github.workspace }}/../tagmail-seed

jobs:
  seed-readable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
      - name: Restore seeded Maildir
        id: seed-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SEED_DIR }}
          key: seed-${{ hashFiles('xtask/src/seed.rs') }}-${{ env.SEED }}-${{ env.SEED_COUNT }}-${{ env.SEED_AVG_KB }}
      - name: Seed Maildir
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: cargo xtask seed --seed "$SEED" --count "$SEED_COUNT" --avg-kb "$SEED_AVG_KB" --out "$SEED_DIR"
      - name: Start Dovecot, Gmail-mode Dovecot, Stalwart and Mailpit
        run: |
          cargo xtask dovecot up --gmail
          cargo xtask stalwart up
      - name: Load seed into Dovecot
        run: |
          cargo xtask dovecot load --from "$SEED_DIR"
          cargo xtask dovecot load --gmail --from "$SEED_DIR"
      - name: Read seed with an independent IMAP client
        run: |
          python3 test/smoke/check_seed.py --port 10143 --manifest "$SEED_DIR/tagmail-seed.json"
          python3 test/smoke/check_seed.py --port 10144 --manifest "$SEED_DIR/tagmail-seed.json" --all-mailbox "[Gmail]/All"
      - name: Server logs
        if: failure()
        run: docker compose -f test/compose.yml logs

  imap-dovecot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
      - name: Start Dovecot
        run: cargo xtask dovecot up
      - name: IMAP integration tests
        run: cargo test -p tagmail-imap --features dovecot-tests --test dovecot
      - name: Server logs
        if: failure()
        run: docker compose -f test/compose.yml logs dovecot

  imap-stalwart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
      - name: Start Stalwart
        run: cargo xtask stalwart up
      - name: IMAP integration tests against Stalwart (OBJECTID, EMAILID)
        env:
          TAGMAIL_IMAP_ADDR: 127.0.0.1:10145
          TAGMAIL_IMAP_SERVER: stalwart
        run: cargo test -p tagmail-imap --features dovecot-tests --test dovecot
      - name: Probe Stalwart
        env:
          TAGMAIL_PROBE_PASSWORD: pass1
        run: |
          cargo xtask probe-server --host 127.0.0.1 --port 10145 --security plain --user user1 --json > probe.json
          { echo '```json'; cat probe.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          jq -e '.features.objectid and .keyword_persistence.persisted_after_reconnect and .copy.email_id_equal and (.copy.size_differs | not)' probe.json
      - name: Engine label and draft smoke against Stalwart
        env:
          TAGMAIL_IMAP_ADDR: 127.0.0.1:10145
          TAGMAIL_IMAP_SERVER: stalwart
        run: cargo test -p tagmail-engine --features dovecot-tests --test labels
      - name: Server logs
        if: failure()
        run: docker compose -f test/compose.yml logs stalwart

  engine-dovecot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
      - name: Restore seeded Maildir
        id: seed-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SEED_DIR }}
          key: seed-${{ hashFiles('xtask/src/seed.rs') }}-${{ env.SEED }}-${{ env.SEED_COUNT }}-${{ env.SEED_AVG_KB }}
      - name: Seed Maildir
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: cargo xtask seed --seed "$SEED" --count "$SEED_COUNT" --avg-kb "$SEED_AVG_KB" --out "$SEED_DIR"
      - name: Start Dovecot (plain and Gmail mode)
        run: cargo xtask dovecot up --gmail
      - name: Load seed into Dovecot
        run: cargo xtask dovecot load --from "$SEED_DIR"
      - name: Build engine integration tests
        run: cargo test -p tagmail-engine --features dovecot-tests --test dovecot --test dovecot_seed --test labels --test rebuild --no-run
      - name: Engine integration tests
        env:
          TAGMAIL_SEED_MANIFEST: ${{ env.SEED_DIR }}/tagmail-seed.json
        run: cargo test -p tagmail-engine --features dovecot-tests --test dovecot --test dovecot_seed --test labels --test rebuild -- --nocapture
      - name: Send integration tests (Dovecot and Mailpit)
        run: cargo test -p tagmail-engine --features mailpit-tests --test send
      - name: Multi-account integration tests (Dovecot and Mailpit)
        run: cargo test -p tagmail-engine --features mailpit-tests --test multi_account
      - name: Server logs
        if: failure()
        run: docker compose -f test/compose.yml logs dovecot dovecot-gmail mailpit

  web-playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run build
      - name: Playwright against the mock API (100k threads)
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
