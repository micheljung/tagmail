name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SEED: 1
  SEED_COUNT: 100000
  SEED_AVG_KB: 8
  SEED_DIR: ${{ github.workspace }}/../tagmail-seed

jobs:
  seed-readable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore seeded Maildir
        id: seed-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SEED_DIR }}
          key: seed-${{ hashFiles('xtask/src/seed.rs') }}-${{ env.SEED }}-${{ env.SEED_COUNT }}-${{ env.SEED_AVG_KB }}
      - name: Seed Maildir
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: cargo xtask seed --seed "$SEED" --count "$SEED_COUNT" --avg-kb "$SEED_AVG_KB" --out "$SEED_DIR"
      - name: Start Dovecot, Gmail-mode Dovecot, Stalwart and Mailpit
        run: |
          cargo xtask dovecot up --gmail
          cargo xtask stalwart up
      - name: Load seed into Dovecot
        run: |
          cargo xtask dovecot load --from "$SEED_DIR"
          cargo xtask dovecot load --gmail --from "$SEED_DIR"
      - name: Read seed with an independent IMAP client
        run: |
          python3 test/smoke/check_seed.py --port 10143 --manifest "$SEED_DIR/tagmail-seed.json"
          python3 test/smoke/check_seed.py --port 10144 --manifest "$SEED_DIR/tagmail-seed.json" --all-mailbox "[Gmail]/All"
      - name: Server logs
        if: failure()
        run: docker compose -f test/compose.yml logs

  engine-dovecot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore seeded Maildir
        id: seed-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.SEED_DIR }}
          key: seed-${{ hashFiles('xtask/src/seed.rs') }}-${{ env.SEED }}-${{ env.SEED_COUNT }}-${{ env.SEED_AVG_KB }}
      - name: Seed Maildir
        if: steps.seed-cache.outputs.cache-hit != 'true'
        run: cargo xtask seed --seed "$SEED" --count "$SEED_COUNT" --avg-kb "$SEED_AVG_KB" --out "$SEED_DIR"
      - name: Start Dovecot (plain and Gmail mode)
        run: cargo xtask dovecot up --gmail
      - name: Load seed into Dovecot
        run: cargo xtask dovecot load --from "$SEED_DIR"
      # The sync suite without the seed runs per server in servers.yml.
      - name: Build seeded engine integration test
        run: cargo test -p tagmail-engine --features dovecot-tests --test dovecot_seed --no-run
      - name: Seeded engine integration test
        env:
          TAGMAIL_SEED_MANIFEST: ${{ env.SEED_DIR }}/tagmail-seed.json
        run: cargo test -p tagmail-engine --features dovecot-tests --test dovecot_seed -- --nocapture
      - name: Send integration tests (Dovecot and Mailpit)
        run: cargo test -p tagmail-engine --features mailpit-tests --test send
      - name: Multi-account integration tests (Dovecot and Mailpit)
        run: cargo test -p tagmail-engine --features mailpit-tests --test multi_account
      - name: Server logs
        if: failure()
        run: docker compose -f test/compose.yml logs dovecot dovecot-gmail mailpit

  web-playwright:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - name: Install system libraries for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit
      - run: pnpm run build
      - name: Playwright against the mock API (100k threads)
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report
          retention-days: 7

  # AC 19 end to end; the desktop GUI tests without Dovecot and Mailpit run
  # in desktop.yml.
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev xvfb dbus xdg-utils
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds web/build at compile time.
      - run: pnpm --filter @tagmail/web run build
      - name: Start Dovecot and Mailpit
        run: cargo xtask dovecot up
      - name: Build the offline test
        run: cargo test --locked -p tagmail-desktop --features app,test-hooks,stack-tests --test offline --no-run
      - name: Desktop offline, send exactly once (AC 19)
        timeout-minutes: 20
        run: >-
          dbus-run-session -- xvfb-run -a
          cargo test --locked -p tagmail-desktop --features app,test-hooks,stack-tests
          --test offline -- --nocapture
      - name: Server logs
        if: failure()
        run: docker compose -f test/compose.yml logs dovecot mailpit
