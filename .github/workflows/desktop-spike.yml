name: Desktop spike

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - deny.toml
      - rust-toolchain.toml
      - .github/workflows/desktop-spike.yml
  pull_request:
    paths:
      - desktop/**
      - deny.toml
      - rust-toolchain.toml
      - .github/workflows/desktop-spike.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SPIKE_SELFTEST: "1"

defaults:
  run:
    working-directory: desktop/spike

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev xvfb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/spike
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features app -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --features app
      # Exits 0 only when every in-webview check in ui/app.js passed.
      - run: xvfb-run -a target/debug/tagmail-desktop-spike
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: desktop/spike/Cargo.toml

  # Build everywhere; the in-webview self-test is informational until
  # WKWebView and WebView2 have been checked by hand.
  other:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/spike
      - run: cargo test --locked
      - run: cargo build --locked --features app
      - run: target/debug/tagmail-desktop-spike
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
