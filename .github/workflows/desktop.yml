name: Desktop

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - web/**
      - packages/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - rust-toolchain.toml
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - desktop/**
      - web/**
      - packages/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - rust-toolchain.toml
      - .github/workflows/desktop.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAGMAIL_DESKTOP_SELFTEST: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev xvfb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds web/build at compile time.
      - run: pnpm --filter @tagmail/web run build
      - run: cargo fmt -p tagmail-desktop --check
      - run: cargo clippy --locked -p tagmail-desktop --all-targets --features app,test-hooks -- -D warnings
      - run: cargo test --locked -p tagmail-desktop --features test-hooks
      - run: cargo build --locked -p tagmail-desktop --features app,test-hooks
      # Exits 0 only when every in-webview check in selftest/selftest.js passed.
      - run: TAGMAIL_DESKTOP_DATA_DIR="$RUNNER_TEMP/desktop" xvfb-run -a target/debug/tagmail-desktop
        timeout-minutes: 5

  # Build everywhere; the in-webview self-test is informational until
  # WKWebView and WebView2 have been checked by hand (release checklist).
  other:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tagmail/web run build
      - run: cargo test --locked -p tagmail-desktop --features test-hooks
      - run: cargo build --locked -p tagmail-desktop --features app,test-hooks
      - run: TAGMAIL_DESKTOP_DATA_DIR="$RUNNER_TEMP/desktop" target/debug/tagmail-desktop
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
