name: Desktop

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - web/**
      - packages/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - rust-toolchain.toml
      - .github/workflows/desktop.yml
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAGMAIL_DESKTOP_SELFTEST: "1"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            run:
              - 'desktop/**'
              - 'web/**'
              - 'packages/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'pnpm-lock.yaml'
              - 'rust-toolchain.toml'
              - '.github/workflows/desktop.yml'

  linux:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev xvfb dbus xdg-utils xdotool
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds web/build at compile time.
      - run: pnpm --filter @tagmail/web run build
      - run: cargo fmt -p tagmail-desktop --check
      - run: cargo clippy --locked -p tagmail-desktop --all-targets --features app,test-hooks -- -D warnings
      - run: cargo test --locked -p tagmail-desktop --features test-hooks
      - run: cargo build --locked -p tagmail-desktop --features app,test-hooks
      # Exits 0 only when every in-webview check in selftest/selftest.js passed.
      # Single-instance and notifications need a session bus.
      - run: TAGMAIL_DESKTOP_DATA_DIR="$RUNNER_TEMP/desktop" dbus-run-session -- xvfb-run -a target/debug/tagmail-desktop
        timeout-minutes: 5
      # AC 17 (D-Bus notification, tray count), AC 18 (xdg-open mailto:) and
      # offline writes and 100k-thread parity through the webview.
      - run: >-
          dbus-run-session -- xvfb-run -a
          cargo test --locked -p tagmail-desktop --features app,test-hooks
          --test notify --test mailto --test writes --test parity --test links -- --test-threads=1
        timeout-minutes: 10

  # Build everywhere; the in-webview self-test is informational until
  # WKWebView and WebView2 have been checked by hand (release checklist).
  other:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tagmail/web run build
      - run: cargo test --locked -p tagmail-desktop --features test-hooks
      - run: cargo build --locked -p tagmail-desktop --features app,test-hooks
      - run: TAGMAIL_DESKTOP_DATA_DIR="$RUNNER_TEMP/desktop" target/debug/tagmail-desktop
        shell: bash
        timeout-minutes: 3
        continue-on-error: true

  result:
    name: desktop-result
    needs: [changes, linux, other]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
