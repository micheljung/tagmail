name: Servers

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            run:
              - 'crates/imap/**'
              - 'crates/engine/**'
              - 'crates/store/**'
              - 'crates/core/**'
              - 'crates/api-core/**'
              - 'crates/dav/**'
              - 'crates/calendar/**'
              - 'test/dovecot/**'
              - 'test/stalwart/**'
              - 'test/radicale/**'
              - 'test/compose.yml'
              - 'xtask/**'
              - '.cargo/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/servers.yml'

  server:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    name: ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: dovecot
            up: dovecot up --gmail
            port: 10143
            user: user2
            password: pass2
            services: dovecot dovecot-gmail
          - server: stalwart
            up: stalwart up
            port: 10145
            user: user1
            password: pass1
            services: stalwart
    env:
      TAGMAIL_IMAP_SERVER: ${{ matrix.server }}
      TAGMAIL_IMAP_ADDR: 127.0.0.1:${{ matrix.port }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
      - name: Start ${{ matrix.server }}
        run: cargo xtask ${{ matrix.up }}
      - name: Build the IMAP and sync suites
        run: |
          cargo test -p tagmail-imap --features dovecot-tests --test dovecot --no-run
          cargo test -p tagmail-engine --features dovecot-tests --test dovecot --test labels --test rebuild --no-run
      - name: IMAP suite
        run: cargo test -p tagmail-imap --features dovecot-tests --test dovecot
      - name: Probe
        env:
          TAGMAIL_PROBE_PASSWORD: ${{ matrix.password }}
          OBJECTID: ${{ matrix.server == 'stalwart' }}
        run: |
          cargo xtask probe-server --host 127.0.0.1 --port ${{ matrix.port }} --security plain --user ${{ matrix.user }} --json > probe.json
          { echo '```json'; cat probe.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          jq -e --argjson objectid "$OBJECTID" '.features.objectid == $objectid and .keyword_persistence.persisted_after_reconnect and (.copy.size_differs | not) and (($objectid | not) or .copy.email_id_equal)' probe.json
      - name: Sync suite (engine sync, labels and ops, cache rebuild)
        run: cargo test -p tagmail-engine --features dovecot-tests --test dovecot --test labels --test rebuild -- --nocapture
      - name: Server logs
        if: failure()
        run: docker compose -f test/compose.yml logs ${{ matrix.services }}

  caldav:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
    name: caldav-${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: radicale
            up: cargo xtask dovecot up && cargo xtask radicale up
            caldav: 127.0.0.1:10232
            imap: 127.0.0.1:10143
            dav_tests: --test radicale
            engine_tests: --test calendar
            services: dovecot radicale mailpit
          - server: stalwart
            up: cargo xtask stalwart up
            caldav: 127.0.0.1:10080
            imap: 127.0.0.1:10145
            dav_tests: --test stalwart
            engine_tests: --test calendar_stalwart
            services: stalwart mailpit
    env:
      TAGMAIL_CALDAV_ADDR: ${{ matrix.caldav }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
      - name: Calendar users are up to date
        run: cargo xtask gen-cal-users --check
      - name: Start ${{ matrix.server }}
        run: ${{ matrix.up }}
      - name: CalDAV client suite
        run: cargo test -p tagmail-dav --features caldav-tests ${{ matrix.dav_tests }}
      - name: Engine calendar suite
        env:
          TAGMAIL_IMAP_SERVER: ${{ matrix.server == 'stalwart' && 'stalwart' || '' }}
          TAGMAIL_IMAP_ADDR: ${{ matrix.imap }}
        run: cargo test -p tagmail-engine --features caldav-tests,mailpit-tests ${{ matrix.engine_tests }}
      - name: Server logs
        if: failure()
        run: docker compose -f test/compose.yml logs ${{ matrix.services }}

  result:
    name: servers-result
    needs: [changes, server, caldav]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
