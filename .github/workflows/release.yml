name: Release dry-run

# Builds every desktop bundle unsigned and publishes nothing (signing and
# publishing are M7). No Flatpak until after 1.0 (owner decision).
on:
  pull_request:
    paths:
      - desktop/**
      - web/**
      - packages/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: "@tauri-apps/cli@2.12.6"

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage,deb,rpm
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            bundles: msi,nsis
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file rpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          targets: ${{ matrix.rust-targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tagmail/web run build
      - name: Bundle
        working-directory: desktop/src-tauri
        shell: bash
        env:
          # linuxdeploy's bundled strip cannot read the runner's newer libs,
          # and the runner has no FUSE to run AppImage tools in place.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: >-
          pnpm dlx "$TAURI_CLI" build --ci
          --features app
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
      - name: No test hooks in the release binary
        shell: bash
        run: |
          bin=$(ls target/${{ matrix.target }}/release/tagmail-desktop{,.exe} 2>/dev/null | head -1)
          test -n "$bin"
          for hook in TAGMAIL_DESKTOP_PAIR /__probe/ DESKTOP_SELFTEST; do
            if grep -aq "$hook" "$bin"; then
              echo "::error::$bin contains the test hook $hook"
              exit 1
            fi
          done
      - name: Collect bundles
        shell: bash
        run: |
          mkdir dist
          bundle="target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -l dist
          count=$(find dist -type f | wc -l)
          expected=$(tr ',' '\n' <<< "${{ matrix.bundles }}" | wc -l)
          test "$count" -eq "$expected"
      - uses: actions/upload-artifact@v6
        with:
          name: bundles-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  checksums:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
      - uses: actions/upload-artifact@v6
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
