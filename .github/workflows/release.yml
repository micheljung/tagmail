name: Release

# Pull requests and manual runs build every asset and publish nothing. A
# v* tag publishes the GitHub Release and the image; tags containing '-'
# are prereleases and leave :latest alone. No Flatpak until after 1.0
# (owner decision).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - desktop/**
      - web/**
      - packages/**
      - crates/**
      - deploy/docker/**
      - Cargo.toml
      - Cargo.lock
      - pnpm-lock.yaml
      - .github/workflows/release.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: "@tauri-apps/cli@2.12.6"
  IMAGE: ghcr.io/micheljung/tagmail
  DESKTOP_ASSETS: 6
  SERVER_ASSETS: 2

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Versions agree
        id: check
        run: |
          cargo=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          tauri=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          web=$(jq -r .version web/package.json)
          echo "Cargo $cargo, tauri.conf.json $tauri, web $web"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$cargo
          fi
          for v in "$cargo" "$tauri" "$web"; do
            if [ "$v" != "$version" ]; then
              echo "::error::version $v does not match $version"
              exit 1
            fi
          done
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  bundle:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage,deb,rpm
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            bundles: msi,nsis
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file rpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          targets: ${{ matrix.rust-targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tagmail/web run build
      - name: Bundle
        working-directory: desktop/src-tauri
        shell: bash
        env:
          # linuxdeploy's bundled strip cannot read the runner's newer libs,
          # and the runner has no FUSE to run AppImage tools in place.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: >-
          pnpm dlx "$TAURI_CLI" build --ci
          --features app
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
      - name: No test hooks in the release binary
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/tagmail-desktop
          [ -f "$bin" ] || bin="$bin.exe"
          test -f "$bin"
          for hook in TAGMAIL_DESKTOP_PAIR /__probe/ /__selftest/ DESKTOP_SELFTEST; do
            if grep -aq "$hook" "$bin"; then
              echo "::error::$bin contains the test hook $hook"
              exit 1
            fi
          done
      - name: Collect bundles
        shell: bash
        run: |
          mkdir dist
          bundle="target/${{ matrix.target }}/release/bundle"
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          ls -l dist
          count=$(find dist -type f | wc -l)
          expected=$(tr ',' '\n' <<< "${{ matrix.bundles }}" | wc -l)
          test "$count" -eq "$expected"
      - uses: actions/upload-artifact@v6
        with:
          name: bundles-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  server:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            target: x86_64-unknown-linux-musl
            file: x86-64
          - platform: linux/arm64
            arch: arm64
            target: aarch64-unknown-linux-musl
            file: ARM aarch64
    runs-on: ubuntu-latest
    env:
      NAME: tagmail-server-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the server and web app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          target: dist
          outputs: type=local,dest=${{ env.NAME }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
      - name: Static binary without test hooks
        run: |
          bin="$NAME/tagmail-server"
          file "$bin" | tee /dev/stderr | grep "${{ matrix.file }}.*static" > /dev/null
          test -f "$NAME/web/index.html"
          for hook in TAGMAIL_DESKTOP_PAIR /__probe/ /__selftest/ DESKTOP_SELFTEST; do
            if grep -aq "$hook" "$bin"; then
              echo "::error::$bin contains the test hook $hook"
              exit 1
            fi
          done
      - name: Tarball
        run: |
          cp LICENSE README.md "$NAME/"
          mkdir dist
          tar -czf "dist/$NAME.tar.gz" --owner=0 --group=0 "$NAME"
          tar -tzf "dist/$NAME.tar.gz"
      - uses: actions/upload-artifact@v6
        with:
          name: server-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  image-check:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64

  checksums:
    needs: [bundle, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "$((DESKTOP_ASSETS + SERVER_ASSETS))"
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  image:
    if: github.ref_type == 'tag'
    needs: [version, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            [ "$PRERELEASE" = true ] || echo "$IMAGE:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64

  release:
    if: github.ref_type == 'tag'
    needs: [version, checksums, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "Tagmail ${GITHUB_REF_NAME#v}" "${flags[@]}"
