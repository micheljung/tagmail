[package]
name = "tagmail-imap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Integration tests against the Dovecot test server (test/compose.yml).
dovecot-tests = []

[dependencies]
imap-codec = { version = "=2.0.0-alpha.10", features = ["ext_condstore_qresync", "starttls"] }
imap-next = { version = "=0.3.4", default-features = false, features = ["ext_condstore_qresync", "starttls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tagmail-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing.workspace = true
webpki-roots = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
