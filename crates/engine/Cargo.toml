[package]
name = "tagmail-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Integration tests against the Dovecot test server (test/compose.yml).
dovecot-tests = []
# Send tests against Dovecot and Mailpit (test/compose.yml).
mailpit-tests = ["dovecot-tests"]

[lints]
workspace = true

[dependencies]
ammonia.workspace = true
getrandom.workspace = true
lettre.workspace = true
mail-builder.workspace = true
mail-parser = { workspace = true, features = ["full_encoding"] }
serde.workspace = true
serde_json.workspace = true
tagmail-api-core.workspace = true
tagmail-core.workspace = true
tagmail-imap.workspace = true
tagmail-store.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
