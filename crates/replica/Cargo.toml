[package]
name = "tagmail-replica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["calendar"]
calendar = ["tagmail-api-core/calendar", "dep:tagmail-calendar", "dep:time"]

[dependencies]
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
multer.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["multipart", "rustls-no-provider", "stream"] }
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tagmail-api-core = { workspace = true, features = ["sqlite"] }
tagmail-calendar = { workspace = true, optional = true }
tagmail-core.workspace = true
tagmail-store.workspace = true
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true
zstd.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["rustls-no-provider", "json"] }
tagmail-api-server = { path = "../api-server" }
tagmail-engine.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
