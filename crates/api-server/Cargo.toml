[package]
name = "tagmail-api-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tagmail-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
form_urlencoded.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
ipnet.workspace = true
multer.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tagmail-api-core.workspace = true
tagmail-core.workspace = true
tagmail-engine.workspace = true
tagmail-store.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
webauthn-rs.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true

# Not on musl: its own allocator idles lower (docs/dev/memory.md).
[target.'cfg(not(target_env = "musl"))'.dependencies]
tikv-jemallocator.workspace = true

[dev-dependencies]
async-trait.workspace = true
passkey.workspace = true
tempfile.workspace = true
