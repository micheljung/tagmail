[package]
name = "tagmail-api-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
calendar = ["dep:tagmail-calendar", "dep:time"]
# The `Store` over the server's databases; the desktop replica reads
# through it too.
sqlite = ["dep:hex", "dep:tagmail-store"]

[dependencies]
ammonia.workspace = true
base64.workspace = true
cssparser.workspace = true
form_urlencoded.workspace = true
hex = { workspace = true, optional = true }
hmac.workspace = true
html5ever.workspace = true
mail-parser = { workspace = true, features = ["full_encoding"] }
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tagmail-calendar = { workspace = true, optional = true }
tagmail-core.workspace = true
tagmail-store = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
ts-rs.workspace = true
zeroize.workspace = true

[dev-dependencies]
peak_alloc.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
