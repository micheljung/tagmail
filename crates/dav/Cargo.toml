[package]
name = "tagmail-dav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# In-process DiscoveryEnv fakes for CalDAV integration tests.
caldav-tests = []

[lints]
workspace = true

[dependencies]
futures-util.workspace = true
percent-encoding.workspace = true
psl.workspace = true
quick-xml = { workspace = true, features = ["async-tokio"] }
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"] }
rustls.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[[test]]
name = "radicale"
required-features = ["caldav-tests"]

[[test]]
name = "stalwart"
required-features = ["caldav-tests"]
